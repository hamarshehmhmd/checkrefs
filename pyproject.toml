[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "checkrefs"
version = "0.1.0"
description = "Check that the files, line numbers, functions, code quotes, versions and stack frames a bug report, security report or PR cites actually exist in your repo. Triage for maintainers drowning in made-up reports."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Mohammad Hamarsheh" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["triage", "bug-reports", "security-reports", "bug-bounty", "maintainers", "open-source", "github-actions", "ai-slop", "issue-triage"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Bug Tracking",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/hamarshehmhmd/checkrefs"
Issues = "https://github.com/hamarshehmhmd/checkrefs/issues"

[project.scripts]
checkrefs = "checkrefs.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
